<title>FPS Board Policy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: sticky search band on top; two-column workspace (section rail + results/policy reader) that stacks on phones; print tray docks at the bottom. */
/* Brand: FPS black (#2D2926) and gold (#F6A704), light gold (#F8D085) for highlights, gray (#999999) for rules.
   Gold carries fills and underlines only; text stays on ink for contrast. */
:root {
  --bg: #f7f6f3; --surface: #ffffff; --sunken: #f0ede8; --line: #e0dcd5; --line-strong: #999999;
  --ink: #2d2926; --ink-2: #4f4944; --ink-3: #6a635c;
  --band: #2d2926; --band-ink: #ffffff; --band-ink-2: #cfc9c1; --field: #ffffff; --field-ink: #2d2926;
  --gold: #f6a704; --gold-ink: #2d2926; --gold-soft: #fcefd0; --gold-light: #f8d085;
  --link: #2d2926; --focus: #2d2926; --doc-rule: #2d2926;
  --mark: #f8d085; --mark-ink: #2d2926; --warn-bg: #f8d085; --warn-ink: #2d2926;
  --font-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-doc: "Source Serif 4", Georgia, "Times New Roman", serif;
  --radius: 6px;
  --shadow: 0 1px 2px rgba(45,41,38,.07), 0 4px 14px rgba(45,41,38,.07);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1a18; --surface: #2d2926; --sunken: #37322e; --line: #47413c; --line-strong: #999999;
  --ink: #f4f0ea; --ink-2: #d2cbc2; --ink-3: #aaa298;
  --band: #141210; --band-ink: #ffffff; --band-ink-2: #bdb6ad; --field: #2d2926; --field-ink: #f4f0ea;
  --gold: #f6a704; --gold-ink: #2d2926; --gold-soft: #4a3d22; --gold-light: #f8d085;
  --link: #f8d085; --focus: #f6a704; --doc-rule: #f6a704;
  --mark: #f8d085; --mark-ink: #2d2926; --warn-bg: #f8d085; --warn-ink: #2d2926;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1d1a18; --surface: #2d2926; --sunken: #37322e; --line: #47413c; --line-strong: #999999;
  --ink: #f4f0ea; --ink-2: #d2cbc2; --ink-3: #aaa298;
  --band: #141210; --band-ink: #ffffff; --band-ink-2: #bdb6ad; --field: #2d2926; --field-ink: #f4f0ea;
  --gold: #f6a704; --gold-ink: #2d2926; --gold-soft: #4a3d22; --gold-light: #f8d085;
  --link: #f8d085; --focus: #f6a704; --doc-rule: #f6a704;
  --mark: #f8d085; --mark-ink: #2d2926; --warn-bg: #f8d085; --warn-ink: #2d2926;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
a { color: var(--link); text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.top :focus-visible, .tray :focus-visible { outline-color: var(--gold); }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; z-index: 50; background: var(--surface); padding: 6px 10px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1240px; margin: 0 auto; }

/* Header + search */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); color: var(--band-ink); border-bottom: 4px solid var(--gold); }
.top .wrap { padding-block: 14px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; color: var(--band-ink); font-family: var(--font-doc); font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
.brand h1 a { color: inherit; text-decoration: none; }
.brand .sub { color: var(--band-ink-2); font-size: 13px; }
.brand h1::before { content: ""; display: inline-block; width: 10px; height: 10px; background: var(--gold); margin-right: 10px; vertical-align: 3px; }
.proto { margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: var(--warn-bg); color: var(--warn-ink); padding: 3px 8px; border-radius: 99px; }
.searchrow { display: flex; gap: 8px; flex-wrap: wrap; }
.search { flex: 1 1 320px; position: relative; min-width: 0; }
.search input { width: 100%; padding: 11px 38px 11px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--field); color: var(--field-ink); font-size: 16px; }
input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
#main:focus { outline: none; }
.search input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px var(--gold); }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; padding: 6px 8px; cursor: pointer; color: var(--ink-3); font-size: 18px; line-height: 1; }
.searchrow select { padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--field); color: var(--field-ink); max-width: 100%; }
.hint { font-size: 12.5px; color: var(--band-ink-2); }
.hint code { font-family: inherit; background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; color: var(--gold-light); }

/* Workspace */
.work { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; padding-block: 22px 120px; }
@media (max-width: 640px) {
  .top { position: static; } .hint { display: none; } .proto { margin-left: 0; }
  .searchrow select { flex: 1 1 40%; min-width: 0; }
}
@media (max-width: 860px) { .work { grid-template-columns: minmax(0,1fr); gap: 14px; } .rail { display: none; } }
.rail { position: sticky; top: 150px; align-self: start; }
.rail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 0 0 8px; font-weight: 600; }
.rail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rail button { width: 100%; text-align: left; display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; align-items: baseline; border: 0; background: none; padding: 7px 8px; border-radius: var(--radius); cursor: pointer; color: var(--ink-2); font-size: 14px; }
.rail button:hover { background: var(--sunken); }
.rail button[aria-pressed="true"] { background: var(--gold-soft); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--gold); }
.rail .sn { font-variant-numeric: tabular-nums; color: var(--ink-3); font-weight: 600; }
.rail .ct { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.bar .count { font-weight: 600; }
.bar .spacer { flex: 1; }
.linkbtn { border: 0; background: none; color: var(--link); text-decoration-color: var(--gold); text-decoration-thickness: 2px; cursor: pointer; padding: 4px 2px; font-size: 14px; text-decoration: underline; text-underline-offset: 2px; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 12px; border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
.btn.primary:hover { background: var(--gold-light); border-color: var(--gold-light); }

.group-h { margin: 22px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; display: flex; gap: 8px; }
.group-h:first-child { margin-top: 8px; }
.sub-h { margin: 12px 0 2px 34px; font-size: 13px; color: var(--ink-2); font-style: italic; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 26px 72px minmax(0,1fr); gap: 4px 10px; align-items: start; padding: 10px 6px; border-bottom: 1px solid var(--line); }
.row:hover { background: var(--surface); }
.row input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--gold); }
.row .num { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); padding-top: 1px; }
.row .main { min-width: 0; }
.row .title { font-weight: 600; color: var(--ink); text-decoration: none; font-size: 15.5px; }
.row .title:hover { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }
.row .meta { font-size: 12.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 1px; }
.row .snip { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; font-family: var(--font-doc); }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--sunken); color: var(--ink-2); vertical-align: 1px; margin-left: 6px; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 1px; border-radius: 2px; }
.empty { padding: 40px 0; color: var(--ink-2); max-width: 52ch; }

/* Policy reader */
.reader { max-width: 760px; }
.back { margin-bottom: 14px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--doc-rule); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(18px, 4vw, 44px); }
.doc-eyebrow { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.doc-num { display: inline-block; font-size: 14px; font-weight: 700; background: var(--gold); color: var(--gold-ink); padding: 2px 9px; border-radius: 4px; margin-top: 12px; font-variant-numeric: tabular-nums; }
.doc h2 { font-family: var(--font-doc); font-weight: 600; font-size: clamp(24px, 3.2vw, 32px); line-height: 1.18; margin: 2px 0 14px; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--ink-2); padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.facts b { color: var(--ink); font-weight: 600; }
.doc-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: -6px 0 22px; }
.body { font-family: var(--font-doc); font-size: 17px; line-height: 1.62; max-width: 68ch; }
.body p { margin: 0 0 .9em; }
.body ol, .body ul { padding-left: 1.6em; margin: 0 0 .9em; }
.body li > p { margin: 0 0 .35em; }
.body blockquote { margin: 0 0 .9em 1.4em; padding: 0; }
.body h1, .body h2, .body h3, .body h4, .body h5, .body h6 { font-family: var(--font-ui); font-size: 16px; margin: 1.4em 0 .5em; }
.body table { border-collapse: collapse; font-family: var(--font-ui); font-size: 13.5px; }
.body td, .body th { border: 1px solid var(--line); padding: 5px 8px; vertical-align: top; text-align: left; }
.tablewrap { overflow-x: auto; margin: 0 0 1em; }
.body .appendix { border-top: 2px solid var(--line); margin-top: 2em; padding-top: 1.2em; }
.body .appendix::before { content: "Attached material"; display: block; font-family: var(--font-ui); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 10px; }
.refs { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; }
.refs h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
.refs ul { margin: 0; padding-left: 1.1em; }
.related { margin-top: 18px; font-size: 14px; }
.srcnote { margin-top: 26px; font-size: 12px; color: var(--ink-3); }
.pdfnote { padding: 14px; background: var(--sunken); border-radius: var(--radius); font-family: var(--font-ui); font-size: 14px; }

/* Print tray */
.tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--band); color: var(--band-ink); border-top: 4px solid var(--gold); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -4px 18px rgba(0,0,0,.18); }
.tray .wrap { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 12px; }
.tray .btn { background: transparent; color: var(--band-ink); border-color: var(--line-strong); }
.tray .btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.tray .linkbtn { color: var(--band-ink); }
.tray strong { font-variant-numeric: tabular-nums; }

/* Print preview overlay (on screen) */
.pv { position: fixed; inset: 0; z-index: 40; background: var(--sunken); overflow: auto; }
.pv-bar { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); z-index: 2; }
.pv-bar .wrap { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 12px; }
.pv-note { font-size: 13px; color: var(--ink-2); flex: 1 1 280px; }
.sheet { background: #fff; color: #111; max-width: 8.5in; margin: 20px auto; padding: .8in .85in; box-shadow: var(--shadow); font-family: var(--font-doc); font-size: 11.5pt; line-height: 1.45; }
.sheet + .sheet { margin-top: 24px; }
.sheet .p-head { font-family: var(--font-ui); font-size: 9pt; color: #2d2926; display: flex; justify-content: space-between; border-bottom: 3px solid #f6a704; padding-bottom: 4px; margin-bottom: 16px; gap: 10px; }
.sheet h2 { font-size: 17pt; margin: 0 0 4px; font-weight: 600; }
.sheet .p-num { font-family: var(--font-ui); font-weight: 700; font-size: 11pt; }
.sheet .p-facts { font-family: var(--font-ui); font-size: 9pt; color: #333; margin: 6px 0 14px; }
.sheet p { margin: 0 0 .7em; }
.sheet ol, .sheet ul { padding-left: 1.5em; }
.sheet blockquote { margin: 0 0 .7em 1.3em; }
.sheet table { border-collapse: collapse; font-size: 9pt; font-family: var(--font-ui); }
.sheet td, .sheet th { border: 1px solid #999; padding: 3px 6px; vertical-align: top; }
.sheet .appendix { border-top: 1px solid #999; margin-top: 1.4em; padding-top: 1em; }
.sheet .p-refs { font-family: var(--font-ui); font-size: 9.5pt; margin-top: 14px; }
.sheet .p-foot { font-family: var(--font-ui); font-size: 8pt; color: #666; border-top: 1px solid #ccc; margin-top: 22px; padding-top: 6px; }
.sheet a { color: inherit; text-decoration: none; }
.sheet mark { background: none; color: inherit; }
.sheet .list-t { width: 100%; border-collapse: collapse; font-family: var(--font-ui); font-size: 10pt; }
.sheet .list-t th, .sheet .list-t td { border: 0; border-bottom: 1px solid #ccc; padding: 5px 6px; text-align: left; }
.sheet .list-t th { border-bottom: 1.5px solid #333; font-size: 9pt; text-transform: uppercase; letter-spacing: .04em; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

@page { size: letter; margin: .6in .65in .7in; @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 8pt "Public Sans", sans-serif; color: #666; } }
@media print {
  body { background: #fff; }
  body::before, .top, .work, .tray, .pv-bar, .skip { display: none !important; }
  .pv { position: static; overflow: visible; background: #fff; }
  .sheet { box-shadow: none; margin: 0; padding: 0; max-width: none; }
  .sheet + .sheet { margin-top: 0; break-before: page; }
  .sheet h2, .sheet .p-num { break-after: avoid; }
  .sheet tr, .sheet li { break-inside: avoid; }
}
</style>

<a class="skip" href="#main">Skip to results</a>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1><a href="#" id="home">FPS Board Policy</a></h1>
      <span class="sub">Fremont Public Schools · Board of Education</span>
      <span class="proto" title="Content was converted automatically from the district's Word files and has not been verified.">Prototype</span>
    </div>
    <div class="searchrow" role="search">
      <div class="search">
        <label for="q" class="skip">Search policies</label>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search by keyword, policy number or title">
        <button class="clear" id="qclear" aria-label="Clear search" hidden>×</button>
      </div>
      <label for="fsec" class="skip">Section</label>
      <select id="fsec"><option value="">All sections</option></select>
    </div>
    <div class="hint">Try <code>9141</code>, <code>bullying</code>, <code>"closed session"</code> or an old code like <code>52B.3</code>. Multiple words find policies containing all of them.</div>
  </div>
</header>

<div class="wrap work">
  <nav class="rail" aria-label="Sections">
    <h2>Sections</h2>
    <ul id="rail"></ul>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<div class="tray" id="tray" hidden>
  <div class="wrap">
    <span><strong id="selcount">0</strong> selected for printing</span>
    <button class="btn primary" id="printSel">Print selected</button>
    <button class="btn" id="viewSel">Show selected</button>
    <button class="linkbtn" id="clearSel">Clear</button>
  </div>
</div>

<div class="pv" id="pv" hidden>
  <div class="pv-bar"><div class="wrap">
    <button class="btn" id="pvClose">← Back</button>
    <button class="btn primary" id="pvPrint">Print</button>
    <span class="pv-note" id="pvNote"></span>
  </div></div>
  <div id="pvBody"></div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById('data').textContent);
const SEC = DATA.sections, DOCS = DATA.docs;
const BY_ID = Object.fromEntries(DOCS.map(d => [d.id, d]));
const CAN_PRINT = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); };
const shortDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return `${m}/${d}/${y}`; };
const lastRev = d => d.r.length ? d.r[d.r.length - 1] : '';

// plain text for search
const tmp = document.createElement('div');
for (const d of DOCS) {
  tmp.innerHTML = d.h.replace(/<\/(p|li|h\d|td|th|tr|blockquote|section)>|<br\/?>/g, ' $&'); d.text = tmp.textContent.replace(/\s+/g, ' ');
  d.lt = d.text.toLowerCase(); d.ltitle = d.t.toLowerCase(); d.lsub = d.sub.toLowerCase(); d.llr = d.lr.join(' ').toLowerCase();
  d.keys = [d.n, d.oc].filter(Boolean).map(x => x.toLowerCase());
}

const state = { q: '', sec: '', type: '', sel: new Set(), lastList: [] };
try { const s = JSON.parse(localStorage.getItem('fps-sel') || '[]'); s.forEach(id => BY_ID[id] && state.sel.add(id)); } catch (e) {}
const saveSel = () => { try { localStorage.setItem('fps-sel', JSON.stringify([...state.sel])); } catch (e) {} };

// filters
$('#fsec').innerHTML += Object.entries(SEC).map(([k, v]) => `<option value="${k}">${k} – ${esc(v)}</option>`).join('');
function renderRail(counts) {
  $('#rail').innerHTML = `<li><button data-sec="" aria-pressed="${!state.sec}"><span class="sn"></span><span>All sections</span><span class="ct">${counts.all}</span></button></li>` +
    Object.entries(SEC).map(([k, v]) => `<li><button data-sec="${k}" aria-pressed="${state.sec === k}"><span class="sn">${k}</span><span>${esc(v)}</span><span class="ct">${counts[k] || 0}</span></button></li>`).join('');
}
$('#rail').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.sec = b.dataset.sec; $('#fsec').value = state.sec; go(''); });

// search
function parseQuery(q) {
  const phrases = [], words = [];
  q.replace(/"([^"]+)"|(\S+)/g, (_, p, w) => { if (p) phrases.push(p.toLowerCase().trim()); else words.push(w.toLowerCase()); });
  return { phrases, words: words.filter(w => w.length > 0) };
}
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function countOcc(hay, needle, wordStart) {
  if (!needle) return 0;
  const re = new RegExp((wordStart ? '(?:^|[^a-z0-9])' : '') + reEsc(needle), 'g');
  return (hay.match(re) || []).length;
}
function search() {
  const raw = state.q.trim();
  let pool = DOCS.filter(d => (!state.sec || d.s === state.sec));
  if (!raw) return { list: pool, ranked: false, terms: [] };
  const lq = raw.toLowerCase().replace(/^policy\s+(no\.?\s*)?/, '');
  const exact = pool.filter(d => d.keys.includes(lq));
  const prefixNum = /^\d{2,4}[a-z]?$/.test(lq) ? pool.filter(d => !exact.includes(d) && d.n.toLowerCase().startsWith(lq)) : [];
  const { phrases, words } = parseQuery(raw);
  const terms = [...phrases, ...words];
  const scored = [];
  for (const d of pool) {
    if (exact.includes(d) || prefixNum.includes(d)) continue;
    let score = 0, ok = true;
    for (const t of terms) {
      const isPhrase = phrases.includes(t);
      const inNum = d.keys.some(k => k === t);
      const ti = countOcc(d.ltitle, t, !isPhrase), su = countOcc(d.lsub, t, !isPhrase), lr = countOcc(d.llr, t, !isPhrase), bo = countOcc(d.lt, t, !isPhrase);
      if (!inNum && !ti && !su && !lr && !bo) { ok = false; break; }
      score += (inNum ? 60 : 0) + ti * 25 + su * 6 + lr * 4 + Math.min(bo, 20) * (1 + 3 / Math.sqrt(d.lt.length / 2000 + 1));
    }
    if (ok) scored.push([score, d]);
  }
  scored.sort((a, b) => b[0] - a[0] || a[1].n.localeCompare(b[1].n));
  return { list: [...exact, ...prefixNum, ...scored.map(x => x[1])], ranked: true, terms };
}
function highlight(text, terms) {
  if (!terms.length) return esc(text);
  return esc(text).replace(new RegExp('(' + terms.map(t => reEsc(esc(t))).join('|') + ')', 'gi'), '<mark>$1</mark>');
}
function snippet(d, terms) {
  if (!terms.length) return '';
  let pos = -1;
  for (const t of terms) { const i = d.lt.indexOf(t); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
  if (pos < 0) return '';
  const start = Math.max(0, d.text.lastIndexOf(' ', Math.max(0, pos - 80)) + 1), end = Math.min(d.text.length, pos + 170);
  return (start > 0 ? '… ' : '') + highlight(d.text.slice(start, end).trim(), terms) + (end < d.text.length ? ' …' : '');
}

// list view
function rowHTML(d, terms) {
  const dates = [d.a && `Adopted ${shortDate(d.a)}`, lastRev(d) && `Revised ${shortDate(lastRev(d))}`].filter(Boolean).join(' · ');
  const chip = '';
  const sn = snippet(d, terms);
  return `<li class="row">
    <input type="checkbox" id="c-${d.id}" data-id="${d.id}" ${state.sel.has(d.id) ? 'checked' : ''} aria-label="Select ${esc(d.n)} ${esc(d.t)} for printing">
    <span class="num">${esc(d.n)}</span>
    <div class="main"><a class="title" href="#${d.id}">${highlight(d.t, terms)}</a>${chip}
      <div class="meta"><span>${d.s} · ${esc(SEC[d.s])}${d.sub ? ' · ' + esc(d.sub) : ''}</span>${dates ? `<span>${dates}</span>` : ''}${d.oc ? `<span>Formerly ${esc(d.oc)}</span>` : ''}</div>
      ${sn ? `<div class="snip">${sn}</div>` : ''}</div></li>`;
}
function renderList() {
  const { list, ranked, terms } = search();
  state.lastList = list; state.terms = terms;
  const counts = { all: 0 };
  DOCS.forEach(d => { counts.all++; counts[d.s] = (counts[d.s] || 0) + 1; });
  renderRail(counts);
  const allSel = list.length && list.every(d => state.sel.has(d.id));
  let html = `<div class="bar"><span class="count" aria-live="polite">${list.length} ${list.length === 1 ? 'document' : 'documents'}${state.q ? ` matching “${esc(state.q)}”` : ''}${state.sec ? ` in Section ${state.sec}` : ''}</span>
    <span class="spacer"></span>
    ${list.length ? `<button class="linkbtn" id="selAll">${allSel ? 'Unselect all' : 'Select all ' + list.length}</button>
    <button class="btn" id="printList">Print this list</button>` : ''}</div>`;
  if (!list.length) {
    html += `<div class="empty"><p><strong>No documents match.</strong></p><p>Check the spelling, try fewer words, or search all sections and types.</p></div>`;
  } else if (ranked) {
    html += `<ul class="list">${list.map(d => rowHTML(d, terms)).join('')}</ul>`;
  } else {
    let cur = '', curSub = null;
    html += list.map(d => {
      let h = '';
      if (d.s !== cur) { if (cur) h += '</ul>'; cur = d.s; curSub = null; h += `<h2 class="group-h"><span>${d.s}</span><span>${esc(SEC[d.s])}</span></h2><ul class="list">`; }
      if (d.sub && d.sub !== curSub) { curSub = d.sub; h += `<li class="sub-h" aria-hidden="true">${esc(d.sub)}</li>`; }
      return h + rowHTML(d, []);
    }).join('') + '</ul>';
  }
  $('#main').innerHTML = html;
  $('#selAll')?.addEventListener('click', () => { if (allSel) list.forEach(d => state.sel.delete(d.id)); else list.forEach(d => state.sel.add(d.id)); syncSel(); renderList(); });
  $('#printList')?.addEventListener('click', () => openPrint('list', list));
}
$('#main').addEventListener('change', e => {
  const c = e.target.closest('input[type=checkbox][data-id]'); if (!c) return;
  c.checked ? state.sel.add(c.dataset.id) : state.sel.delete(c.dataset.id); syncSel();
});
function syncSel() {
  $('#tray').hidden = state.sel.size === 0; $('#selcount').textContent = state.sel.size; saveSel();
  const sa = $('#selAll'); if (sa) { const l = state.lastList; const all = l.length && l.every(d => state.sel.has(d.id)); sa.textContent = all ? 'Unselect all' : 'Select all ' + l.length; }
  const tb = $('#toggleSel'); if (tb) tb.textContent = state.sel.has(tb.dataset.id) ? 'Remove from print list' : 'Add to print list';
}
const selectedDocs = () => DOCS.filter(d => state.sel.has(d.id));
$('#printSel').addEventListener('click', () => openPrint('docs', selectedDocs()));
$('#viewSel').addEventListener('click', () => { state.q = ''; $('#q').value = ''; state.sec = ''; $('#fsec').value = ''; go(''); setTimeout(() => {
  $('#main').querySelector('.bar .count').textContent = `${state.sel.size} selected`;
  $('#main').querySelectorAll('.row').forEach(r => { if (!state.sel.has(r.querySelector('input').dataset.id)) r.remove(); });
  $('#main').querySelectorAll('.group-h, .sub-h').forEach(h => { const ul = h.nextElementSibling; if (h.classList.contains('group-h') && ul && !ul.querySelector('.row')) { ul.remove(); h.remove(); } });
  $('#main').querySelectorAll('.sub-h').forEach(h => { const n = h.nextElementSibling; if (!n || !n.classList.contains('row')) h.remove(); });
}); });
$('#clearSel').addEventListener('click', () => { state.sel.clear(); syncSel(); if (!location.hash || location.hash === '#') renderList(); else showDoc(location.hash.slice(1)); });

// policy view
function bodyHTML(d) {
  if (d.pdf) return `<div class="pdfnote">This form is a PDF. On the live site it will open as a download. Its text is included below so it can be searched.</div><p>${esc(d.text)}</p>`;
  return d.h.replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, '</table></div>');
}
function factsHTML(d, cls) {
  const f = [];
  f.push(`<span>Section <b>${d.s} – ${esc(SEC[d.s])}</b></span>`);
  if (d.a) f.push(`<span>Adopted <b>${fmtDate(d.a)}</b></span>`);
  if (d.r.length) f.push(`<span>Last revised <b>${fmtDate(lastRev(d))}</b></span>`);
  if (d.rv) f.push(`<span>Last reviewed <b>${fmtDate(d.rv)}</b></span>`);
  if (d.oc) f.push(`<span>Formerly <b>${esc(d.oc)}</b></span>`);
  return `<div class="${cls}">${f.join('')}</div>`;
}
function related(d) {
  const ids = new Set(); const m = d.h.match(/href="#(p-[^"]+)"/g) || [];
  m.forEach(x => ids.add(x.slice(7, -1)));
  const base = (d.n.match(/^\d{4}/) || [])[0];
  if (base) DOCS.forEach(o => { if (o.id !== d.id && o.n.startsWith(base) && o.s === d.s) ids.add(o.id); });
  ids.delete(d.id);
  return [...ids].map(i => BY_ID[i]).filter(Boolean);
}
function markTerms(root, terms) {
  if (!terms.length) return;
  const re = new RegExp('(' + terms.map(reEsc).join('|') + ')', 'gi');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  nodes.forEach(n => { re.lastIndex = 0; const span = document.createElement('span'); span.innerHTML = esc(n.nodeValue).replace(re, '<mark>$1</mark>'); n.replaceWith(...span.childNodes); });
}
function showDoc(id) {
  const d = BY_ID[id]; if (!d) { renderList(); return; }
  const rel = related(d);
  const backLabel = state.q ? `← Back to results for “${esc(state.q)}”` : '← Back to all policies';
  $('#main').innerHTML = `<div class="reader">
    <div class="back"><button class="linkbtn" id="back">${backLabel}</button></div>
    <article class="doc" aria-labelledby="dt">
      <div class="doc-eyebrow">${esc(SEC[d.s])}${d.sub ? ' · ' + esc(d.sub) : ''}</div>
      <div class="doc-num">Policy ${esc(d.n)}</div>
      <h2 id="dt">${esc(d.t)}</h2>
      ${factsHTML(d, 'facts')}
      <div class="doc-actions">
        <button class="btn primary" id="printOne">Print this policy</button>
        <button class="btn" id="toggleSel" data-id="${d.id}">${state.sel.has(d.id) ? 'Remove from print list' : 'Add to print list'}</button>
        <button class="btn" id="copyLink">Copy link</button>
      </div>
      <div class="body" id="dbody">${bodyHTML(d)}</div>
      ${d.lr.length ? `<div class="refs"><h3>Legal references</h3><ul>${d.lr.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${rel.length ? `<div class="related"><div class="refs" style="margin-top:0"><h3>Related documents</h3><ul>${rel.map(o => `<li><a href="#${o.id}">${esc(o.n)} ${esc(o.t)}</a></li>`).join('')}</ul></div></div>` : ''}
      <div class="srcnote">Converted from <em>${esc(d.f)}</em>.</div>
    </article></div>`;
  markTerms($('#dbody'), state.terms || []);
  $('#back').addEventListener('click', () => go(''));
  $('#printOne').addEventListener('click', () => openPrint('docs', [d]));
  $('#toggleSel').addEventListener('click', () => { state.sel.has(d.id) ? state.sel.delete(d.id) : state.sel.add(d.id); syncSel(); });
  $('#copyLink').addEventListener('click', e => {
    const url = location.href.split('#')[0] + '#' + d.id, b = e.currentTarget;
    const done = () => { b.textContent = 'Link copied'; setTimeout(() => b.textContent = 'Copy link', 1800); };
    try { navigator.clipboard.writeText(url).then(done, () => { b.textContent = url; }); } catch (err) { b.textContent = url; }
  });
  window.scrollTo(0, 0); $('#main').focus({ preventScroll: true });
}

// print
function sheetFor(d) {
  return `<section class="sheet">
    <div class="p-head"><span>Fremont Public Schools · Board Policy</span><span>${esc(SEC[d.s])}</span></div>
    <div class="p-num">Policy ${esc(d.n)}</div>
    <h2>${esc(d.t)}</h2>
    <div class="p-facts">${[d.sub && esc(d.sub), d.a && 'Adopted ' + fmtDate(d.a), d.r.length && 'Last revised ' + fmtDate(lastRev(d)), d.rv && 'Last reviewed ' + fmtDate(d.rv)].filter(Boolean).join(' · ')}</div>
    <div class="p-body">${d.pdf ? `<p>${esc(d.text)}</p>` : d.h}</div>
    ${d.lr.length ? `<div class="p-refs"><strong>Legal references:</strong> ${d.lr.map(esc).join('; ')}</div>` : ''}
    <div class="p-foot">Printed ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })} from FPS Board Policy (prototype). Check the online manual for the current version.</div>
  </section>`;
}
function openPrint(kind, docs) {
  if (!docs.length) return;
  let body;
  if (kind === 'list') {
    const title = state.q ? `Search results for “${esc(state.q)}”` : (state.sec ? `Section ${state.sec} – ${esc(SEC[state.sec])}` : 'All board policies');
    body = `<section class="sheet"><div class="p-head"><span>Fremont Public Schools · Board Policy</span><span>${docs.length} documents</span></div>
      <h2>${title}</h2><div class="p-facts">Printed ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
      <table class="list-t"><thead><tr><th>No.</th><th>Title</th><th>Section</th><th>Adopted</th><th>Last revised</th></tr></thead><tbody>
      ${docs.map(d => `<tr><td><strong>${esc(d.n)}</strong></td><td>${esc(d.t)}</td><td>${d.s}</td><td>${shortDate(d.a)}</td><td>${shortDate(lastRev(d))}</td></tr>`).join('')}
      </tbody></table></section>`;
  } else body = docs.map(sheetFor).join('');
  $('#pvBody').innerHTML = body;
  $('#pvNote').textContent = kind === 'list' ? `List of ${docs.length} documents.` : `${docs.length} ${docs.length === 1 ? 'document' : 'documents'}, each starting on a new page.`;
  if (!CAN_PRINT) { $('#pvPrint').hidden = true; $('#pvNote').textContent += ' This preview window can’t open your printer. To print, open the downloadable copy of this prototype in your browser.'; }
  $('#pv').hidden = false; $('#pv').scrollTop = 0; $('#pvClose').focus();
}
$('#pvClose').addEventListener('click', () => { $('#pv').hidden = true; });
$('#pvPrint').addEventListener('click', () => window.print());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#pv').hidden) $('#pv').hidden = true; });

// routing + inputs
let tmr;
$('#q').addEventListener('input', e => { state.q = e.target.value; $('#qclear').hidden = !state.q; clearTimeout(tmr); tmr = setTimeout(() => go(''), 140); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(tmr); go(''); } });
$('#qclear').addEventListener('click', () => { state.q = ''; $('#q').value = ''; $('#qclear').hidden = true; go(''); $('#q').focus(); });
$('#fsec').addEventListener('change', e => { state.sec = e.target.value; go(''); });
$('#home').addEventListener('click', e => { e.preventDefault(); state.q = ''; $('#q').value = ''; $('#qclear').hidden = true; state.sec = ''; $('#fsec').value = ''; go(''); });
function go(id) {
  if (id) { location.hash = id; return; }
  if (location.hash && location.hash !== '#') { history.replaceState(null, '', location.pathname + location.search); }
  route();
}
function route() { const h = location.hash.slice(1); $('#pv').hidden = true; if (h && BY_ID[h]) showDoc(h); else renderList(); }
window.addEventListener('hashchange', route);
syncSel(); route();
})();
</script>
